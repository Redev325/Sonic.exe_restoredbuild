name: Build and Deploy HTML5 to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: html5-pages
  cancel-in-progress: false

jobs:
  buildHTML5:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.2.5

      - name: Install Haxelib dependencies
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp --quiet
          haxelib install hmm --quiet
          haxelib run hmm install

      - name: Create Version Tag
        run: echo "${{ github.run_id }}" > VERSION

      - name: Compile HTML5
        run: haxelib run lime build Project.xml html5 --app-version="4.0.0-${{ github.run_id }}"

      - name: Verify HTML5 output
        shell: bash
        run: |
          set -e
          HTML5_ROOT="export/release/html5/bin"

          test -d "$HTML5_ROOT"
          test -f "$HTML5_ROOT/index.html"

          # Prevent GitHub Pages/Jekyll from rewriting the game files.
          touch "$HTML5_ROOT/.nojekyll"

          echo "HTML5 output:"
          du -sh "$HTML5_ROOT"
          find "$HTML5_ROOT" -maxdepth 2 -type f | head -100

      - name: Create HTML5 ZIP
        shell: bash
        run: |
          set -e
          cd export/release/html5/bin
          zip -r "$GITHUB_WORKSPACE/sonic-exe-html5.zip" .
          cd "$GITHUB_WORKSPACE"
          ls -lh sonic-exe-html5.zip

      - name: Upload HTML5 ZIP
        uses: actions/upload-artifact@v7
        with:
          name: sonic-exe-html5
          path: sonic-exe-html5.zip
          if-no-files-found: error

      - name: Deploy to GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: export/release/html5/bin
          force_orphan: true
          commit_message: "Deploy HTML5 build ${{ github.sha }}"

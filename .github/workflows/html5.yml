name: Build HTML5

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  buildHTML5:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.2.5

      - name: Install Haxelib dependencies
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp --quiet
          haxelib install hmm --quiet
          haxelib run hmm install

      - name: Create Version Tag
        run: echo "${{ github.run_id }}" > VERSION

      - name: Compile HTML5
        run: haxelib run lime build Project.xml html5 --app-version="4.0.0-${{ github.run_id }}"

      - name: Locate HTML5 output
        shell: bash
        run: |
          set -e
          echo "Searching for generated index.html..."
          HTML5_INDEX="$(find export/release -type f -name index.html -print -quit 2>/dev/null || true)"

          if [ -z "$HTML5_INDEX" ]; then
            echo "No HTML5 index.html was found under export/release."
            echo "Export directory tree:"
            find export/release -maxdepth 6 -type f -print 2>/dev/null | head -300 || true
            exit 1
          fi

          HTML5_ROOT="$(dirname "$HTML5_INDEX")"
          echo "HTML5 files are in: $HTML5_ROOT"

          test -d "$HTML5_ROOT"
          test -f "$HTML5_ROOT/index.html"
          echo "HTML5_ROOT=$HTML5_ROOT" >> "$GITHUB_ENV"
          du -sh "$HTML5_ROOT"
          find "$HTML5_ROOT" -maxdepth 2 -type f | head -75

      - name: Create ZIP
        shell: bash
        run: |
          set -e
          test -d "$HTML5_ROOT"
          test -f "$HTML5_ROOT/index.html"
          rm -f sonic-exe-html5.zip

          cd "$HTML5_ROOT"
          zip -r "$GITHUB_WORKSPACE/sonic-exe-html5.zip" .
          cd "$GITHUB_WORKSPACE"

          ls -lh sonic-exe-html5.zip

      - name: Upload HTML5 ZIP
        uses: actions/upload-artifact@v7
        with:
          name: sonic-exe-html5
          path: sonic-exe-html5.zip
          if-no-files-found: error

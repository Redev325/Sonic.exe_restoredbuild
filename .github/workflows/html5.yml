name: Build and Deploy HTML5 to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  buildHTML5:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.2.5

      - name: Install Haxelib dependencies
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp --quiet
          haxelib install hmm --quiet
          haxelib run hmm install

      - name: Create Version Tag
        run: echo "${{ github.run_id }}" > VERSION

      - name: Compile HTML5
        run: haxelib run lime build Project.xml html5 --app-version="4.0.0-${{ github.run_id }}"

      - name: Prepare HTML5 output
        shell: bash
        run: |
          set -e
          HTML5_ROOT="export/release/html5/bin"

          if [ ! -f "$HTML5_ROOT/index.html" ]; then
            echo "HTML5 output was not found at $HTML5_ROOT"
            echo "Generated index.html files:"
            find export -type f -name index.html -print 2>/dev/null || true
            exit 1
          fi

          echo "GitHub Pages site directory: $HTML5_ROOT"
          du -sh "$HTML5_ROOT"
          find "$HTML5_ROOT" -maxdepth 2 -type f | head -100

      - name: Create HTML5 ZIP
        shell: bash
        run: |
          set -e
          cd export/release/html5/bin
          zip -r "$GITHUB_WORKSPACE/sonic-exe-html5.zip" .
          cd "$GITHUB_WORKSPACE"
          ls -lh sonic-exe-html5.zip

      - name: Upload HTML5 ZIP
        uses: actions/upload-artifact@v7
        with:
          name: sonic-exe-html5
          path: sonic-exe-html5.zip
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: export/release/html5/bin

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
